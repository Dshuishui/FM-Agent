[project]
name = "fm-agent"
version = "0.1.0"
description = "Scaling formal methods to large systems via LLM-based Hoare-style reasoning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai==2.15.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "litellm>=1.50.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-cuda>=0.21.1",
]

[project.scripts]
fm-agent = "main:main"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
